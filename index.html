<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c28"><title>UNG Physics Engine</title><style>body{margin:0;background:#0c1823;color:#e9f5f4;font:15px system-ui}main{max-width:850px;margin:auto;padding:18px}h1{font-size:38px;margin:26px 0 6px}p,small{color:#adc0c9}nav{display:flex;overflow:auto;gap:8px;margin:25px 0}button{padding:12px;border:1px solid #41606b;background:#1a303e;color:white;border-radius:10px;font:inherit}button.on,.primary{background:#b6f28c;color:#12201b;font-weight:700}section{background:#152936;border:1px solid #31505e;border-radius:16px;padding:22px}label{display:block;font-size:13px;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:8px;background:#0c1b26;color:white;border:1px solid #42606d;border-radius:8px;font:18px system-ui}.fields,.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result,.law{background:#203b47;border-radius:9px;padding:14px;margin:8px 0}.result b{display:block;color:#b6f28c;font-size:25px;margin:8px 0}.note{border-left:3px solid #b6f28c;padding:13px;background:#213943;margin-top:18px;line-height:1.5}.danger{border-left-color:#ff9b7c}.law b{color:#b6f28c}header{display:flex;align-items:center;gap:10px;font-weight:800}header i{background:#b6f28c;color:#0c1823;border-radius:9px;padding:12px;font-style:normal}footer{font-size:12px;color:#92aab5;margin:30px 0}.check{margin:15px 0;padding:12px;border:1px solid #45606b;border-radius:9px}.check button{margin:5px}.check button.selected{background:#b6f28c;color:#13241b}textarea{width:100%;box-sizing:border-box;background:#0c1b26;color:white;padding:12px;border:1px solid #42606d;border-radius:8px}@media(max-width:480px){h1{font-size:32px}section{padding:15px}.result b{font-size:22px}}</style></head><body><main><header><i>U</i><div>UNG PHYSICS ENGINE<br><small>INDEPENDENT · MOBILE</small></div></header><h1>Physics. Applied.</h1><p>Engineering calculators, 15 foundational laws, 87 formula references and HORUS drone diagnostics.</p><nav id="tabs"></nav><section id="view"></section><footer>Manual engineering estimates only. Not a flight clearance or live hardware interface.</footer></main><script>
const laws=[["Newton 1","Inertia"],["Newton 2","F = ma"],["Newton 3","Action and reaction"],["Hooke","F = -kx"],["Ohm","V = IR"],["Joule","Q = I²Rt"],["Coulomb","F = k|q₁q₂|/r²"],["Energy conservation","E₁ = E₂"],["Momentum conservation","p₁ = p₂"],["Snell","n₁ sinθ₁ = n₂ sinθ₂"],["Reflection","θᵢ = θᵣ"],["Archimedes","F = ρgV"],["Boyle","PV = constant"],["Charles","V/T = constant"],["Kepler 3","T² ∝ a³"]],formulas=["Speed|d/t","Velocity|Δx/Δt","Acceleration|Δv/Δt","Force|ma","Momentum|mv","Impulse|FΔt","Work|Fd cosθ","Power|W/t","Kinetic energy|½mv²","Potential energy|mgh","Weight|mg","Gravitational force|Gm₁m₂/r²","Centripetal force|mv²/r","Centripetal acceleration|v²/r","Work-energy theorem|W = ΔKE","Pressure|F/A","Density|m/V","Hooke's law|F = −kx","Elastic energy|½kx²","Frequency|1/T","Wave speed|fλ","Snell's law|n₁sinθ₁=n₂sinθ₂","Refractive index|c/v","Ohm's law|IR","Electrical power|VI","Coulomb's law|kq₁q₂/r²","Electric field|F/q","Potential difference|W/q","Capacitance|Q/V","Magnetic force|qvBsinθ","Magnetic flux|BAcosθ","Faraday's law|−dΦ/dt","Inductor energy|½LI²","Heat|mcΔT","Latent heat|mL","Gas work|PΔV","First law thermodynamics|ΔU=Q−W","Efficiency|Wout/Qin","Carnot efficiency|1−Tc/Th","Photon energy|hf","Photon momentum|h/λ","de Broglie wavelength|h/p","Photoelectric effect|hf=Φ+KE","Mass energy|mc²","Binding energy|Δmc²","Half life|ln2/λ","Activity|λN","SHM period|2π√(m/k)","SHM angular frequency|√(k/m)","SHM displacement|A sin(ωt+φ)","SHM speed|ω√(A²−x²)","SHM acceleration|−ω²x","SHM energy|½mω²A²","Wave on string|√(T/μ)","Open organ pipe|nv/(2L)","Closed organ pipe|(2n−1)v/(4L)","Doppler effect|f(v±vo)/(v∓vs)","Intensity|P/A","Decibels|10log₁₀(I/I₀)","Thin lens|1/f=1/v−1/u (Cartesian)","Magnification|v/u","Lens power|1/f (meters)","Mirror equation|1/f=1/v+1/u (magnitudes)","Critical angle|asin(n₂/n₁)","Double slit position|mλD/d","Fringe width|λD/d","Gravitational acceleration|GM/r²","Escape speed|√(2GM/r)","Orbital speed|√(GM/r)","Orbital period|2π√(r³/GM)","Gravitational potential energy|−GMm/r","Fluid pressure|ρgh","Buoyancy|ρgV","Continuity|A₁v₁=A₂v₂","Bernoulli|P+½ρv²+ρgh=constant","Stokes drag|6πηrv","Resistance|ρL/A","Conductivity|1/ρ","Temperature resistance|R₀[1+α(T−T₀)]","Drift speed|I/(nqA)","Mobility|vd/E","Relaxation time|m/(nq²ρ)","EM wave speed|1/√(με)","Stefan-Boltzmann|P=εσAT⁴","Wien displacement|λmaxT=b","Nuclear radius|r₀A^(1/3)","Energy density EM|½εE²+ B²/(2μ)"],checks=["Controller or wiring overheats","Battery/USB causes power loss","Controller orientation verified","Motor mapping and direction verified","Propeller direction verified","Measured thrust verified"];
const S={tab:"Drone",mass:"500",motors:"4",ratio:"2",thrust:"",voltage:"12",current:"3",resistance:"4",seconds:"60",n1:"1",n2:"1.5",angle:"30",query:"",notes:"",checks:Array(6).fill("Unknown")};
const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const field=(k,label)=>'<label>'+label+'<input type="number" step="any" inputmode="decimal" data-key="'+k+'" value="'+e(S[k])+'"></label>';
const stat=(label,val,unit)=>'<div class="result"><small>'+label+'</small><b>'+val+'</b><small>'+unit+'</small></div>';
function draw(){let t=S.tab,h='',m=Number(S.mass),n=Number(S.motors),r=Number(S.ratio);
if(t==="Drone"){h='<h2>Drone thrust estimator</h2><div class="fields">'+field("mass","Total aircraft mass (g)")+field("motors","Motor count")+field("ratio","Target thrust / weight")+'</div>';if(m>0&&n>0&&Number.isInteger(n)&&r>=1)h+='<div class="results">'+stat("Hover thrust",(m*9.80665/1000).toFixed(2),"N")+stat("Hover thrust / motor",(m/n).toFixed(1),"gf")+stat("Target / motor",(m*r/n).toFixed(1),"gf")+stat("Target total",(m*r*9.80665/1000).toFixed(2),"N")+'</div>';else h+='<p>Enter valid positive values.</p>';h+='<div class="note">Static sizing estimate only. Verify actual motor, propeller, ESC and battery performance.</div>'}
if(t==="Electrical"){let v=Number(S.voltage),i=Number(S.current),o=Number(S.resistance),d=Number(S.seconds);h='<h2>Electrical diagnostics</h2><div class="fields">'+field("voltage","Supply voltage (V)")+field("current","Current (A)")+field("resistance","Resistance (Ω)")+field("seconds","Time (s)")+'</div>';if([v,i,o,d].every(x=>Number.isFinite(x)&&x>=0))h+='<div class="results">'+stat("Input power",(v*i).toFixed(2),"W")+stat("Ohm law voltage",(i*o).toFixed(2),"V")+stat("Resistive heat power",(i*i*o).toFixed(2),"W")+stat("Heat energy",(i*i*o*d).toFixed(2),"J")+'</div>';h+='<div class="note">Supply voltage and computed resistive voltage are independent. This does not predict component temperature.</div>'}
if(t==="Optics"){let a=Number(S.angle),n1=Number(S.n1),n2=Number(S.n2),z=n1*Math.sin(a*Math.PI/180)/n2;h='<h2>Refraction calculator</h2><div class="fields">'+field("n1","Index n₁")+field("n2","Index n₂")+field("angle","Incident angle (degrees)")+'</div>';if(n1>0&&n2>0&&a>=0&&a<90)h+='<div class="results">'+stat("Refracted angle",z<=1?(Math.asin(z)*180/Math.PI).toFixed(2):"—","degrees")+stat("Outcome",z<=1?"Refraction":"Total internal reflection","")+'</div>';else h+='<p>Enter valid indices and angle 0–90 degrees.</p>'}
if(t==="Laws")h='<h2>15 foundational laws</h2>'+laws.map((x,i)=>'<div class="law"><strong>'+(i+1)+'. '+e(x[0])+'</strong><p><b>'+e(x[1])+'</b></p></div>').join('');
if(t==="Formulas")h='<h2>87 physics formulas</h2><label>Search formula<input type="search" id="search" placeholder="e.g. momentum, orbit, lens" value="'+e(S.query)+'"></label><div id="matches"></div>';
if(t==="Diagnostics"){h='<h2>HORUS diagnostic worksheet</h2><p>Enter actual measured thrust. Do not infer thrust from RPM alone.</p><div class="fields">'+field("mass","Mass (g)")+field("motors","Motor count")+field("thrust","Measured thrust per motor (gf)")+'</div>';let p=Number(S.thrust);if(m>0&&n>0&&Number.isInteger(n)&&S.thrust.trim()!==""&&p>=0)h+='<div class="results">'+stat("Measured total",(p*n).toFixed(1),"gf")+stat("Thrust / weight",(p*n/m).toFixed(2)+":1","static")+'</div>';h+=checks.map((c,j)=>'<div class="check"><strong>'+e(c)+'</strong><div>'+["Yes","No","Unknown"].map(a=>'<button data-check="'+j+'" data-answer="'+a+'" class="'+(S.checks[j]===a?"selected":"")+'">'+a+'</button>').join('')+'</div></div>').join('');h+='<div class="note '+((S.checks[0]==="Yes"||S.checks[1]==="Yes")?"danger":"")+'">'+((S.checks[0]==="Yes"||S.checks[1]==="Yes")?"STOP: Disconnect power and resolve overheating or power fault before further testing.":"No reported thermal fault; unknown items still require verification. Not flight clearance.")+'</div><label>Notes<textarea id="notes" rows="4">'+e(S.notes)+'</textarea></label><button class="primary" id="download">Download report</button>'}
document.getElementById("view").innerHTML=h;document.getElementById("tabs").innerHTML=["Drone","Electrical","Optics","Diagnostics","Formulas","Laws"].map(x=>'<button data-tab="'+x+'" class="'+(x===t?"on":"")+'">'+x+'</button>').join('');if(t==="Formulas")matches()}
function matches(){let q=S.query.toLowerCase(),rows=formulas.map((s,i)=>({i,s})).filter(o=>o.s.toLowerCase().includes(q));document.getElementById("matches").innerHTML=rows.map(o=>'<div class="law"><strong>'+(o.i+1)+'. '+e(o.s.split("|")[0])+'</strong><p><b>'+e(o.s.split("|")[1])+'</b></p></div>').join('')||'<p>No matching formulas.</p>'}
document.addEventListener("click",ev=>{let b=ev.target.closest("button");if(!b)return;if(b.dataset.tab){S.tab=b.dataset.tab;draw()}if(b.dataset.check){S.checks[Number(b.dataset.check)]=b.dataset.answer;draw()}if(b.id==="download"){let text=["UNG HORUS diagnostic report","Not flight clearance","Mass: "+S.mass+" g","Motor count: "+S.motors,"Thrust per motor: "+S.thrust+" gf",...checks.map((c,i)=>c+": "+S.checks[i]),"Notes: "+S.notes].join("\n");let url=URL.createObjectURL(new Blob([text],{type:"text/plain"})),a=document.createElement("a");a.href=url;a.download="UNG_HORUS_report.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener("input",ev=>{let el=ev.target;if(el.dataset.key){S[el.dataset.key]=el.value;let k=el.dataset.key,pos=el.selectionStart;draw();let target=document.querySelector('[data-key="'+k+'"]');target?.focus();try{target?.setSelectionRange(pos,pos)}catch{}}else if(el.id==="search"){S.query=el.value;matches()}else if(el.id==="notes")S.notes=el.value});draw();
</script></body></html>
